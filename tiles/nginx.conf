# bray 5b (2026-09-17, Bo: "8 seconds for LA"): a caching tile proxy for the
# OpenFamily app. Street tiles from tile.openstreetmap.org (with the User-Agent
# OSM's tile policy asks for), satellite from Esri World Imagery. Cached for
# 30 days on TILES_CACHE (a bind mount), stale served while the upstream is
# slow or down, the upstream's no-cache ignored. Measured 2026-09-17: a
# 6-way prewarm burst of ~3 000 tiles got our IP throttled by OSM's CDN
# (misses went from 0.3 s to 200 s) - the prewarm is now 1-way, ~2 tiles/s. LAN / tailnet only (the
# compose file publishes it on the same host the API is on). The api's
# GET /config hands the app the templates:
#   http://<host>:8114/street/{z}/{x}/{y}.png
#   http://<host>:8114/satellite/{z}/{y}/{x}.jpg   (Esri's z/y/x order)
worker_processes 2;
events { worker_connections 1024; }
http {
    map $http_accept $webp { "~*image/webp" 1; default 0; }
    proxy_cache_path /cache levels=1:2 keys_zone=tiles:64m max_size=40g inactive=60d use_temp_path=off;
    log_format tiles '$time_iso8601 $upstream_cache_status $status $request_time $body_bytes_sent conn=$connection_requests webp=$webp "$request"';
    access_log /var/log/nginx/tiles.log tiles;
    resolver 127.0.0.11 1.1.1.1 valid=300s ipv6=off;

    map $upstream_cache_status $hit { HIT 1; default 0; }
    # bray 5b: clients that accept WebP (the app's Android decoder does) get
    # re-encoded street tiles from the transcoder (tiles/transcoder.py), ~40 %
    # fewer bytes for a tablet on a hotspot; everyone else keeps OSM's PNG.

    server {
        listen 80;
        keepalive_timeout 120s;          # the tablet reuses one connection for a burst of tiles (the log's conn= counts requests per connection)
        keepalive_requests 1000;
        proxy_cache tiles;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 2s;      # a request waiting on another's fetch of the same tile goes upstream itself after 2 s
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;           # a throttled upstream fails fast (the app just retries the tile) instead of queueing minutes
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;
        proxy_ssl_server_name on;
        add_header X-Tile-Cache $upstream_cache_status always;
        add_header Cache-Control "public, max-age=2592000" always;

        location /health { return 200 "ok\n"; }
        location = /stats { stub_status; }

        location ~ ^/street/(\d+)/(\d+)/(\d+)\.png$ {
            if ($webp) { rewrite ^ /webp$uri last; }
            set $tile_url https://tile.openstreetmap.org/$1/$2/$3.png;
            proxy_pass $tile_url;
            proxy_set_header Host tile.openstreetmap.org;
            proxy_set_header User-Agent "OpenFamily-tile-cache/1.0 (self-hosted family map; bo@centacube.com)";
            proxy_set_header Referer "";
            proxy_cache_key "street/$1/$2/$3";
        }
        location ~ ^/webp/street/(\d+)/(\d+)/(\d+)\.png$ {
            internal;
            proxy_pass http://tiles-webp:8080/street/$1/$2/$3.png;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_cache_key "webp/street/$1/$2/$3";
            proxy_read_timeout 30s;
            add_header Vary Accept always;
            add_header X-Tile-Cache $upstream_cache_status always;
            add_header Cache-Control "public, max-age=2592000" always;
        }
        location ~ ^/satellite/(\d+)/(\d+)/(\d+)\.jpg$ {
            set $tile_url https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/$1/$2/$3;
            proxy_pass $tile_url;
            proxy_set_header Host server.arcgisonline.com;
            proxy_set_header User-Agent "OpenFamily-tile-cache/1.0 (self-hosted family map; bo@centacube.com)";
            proxy_cache_key "satellite/$1/$2/$3";
        }
    }
}
